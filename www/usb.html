<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARACHNE USB</title>
<style>
:root{--bg:#05090c;--glass:rgba(12,22,28,.58);--line:rgba(120,220,255,.16);--line2:rgba(120,220,255,.3);--text:#e4f6ff;--dim:#7fa3b3;--faint:#4a6672;
  --holo:#5fe1ff;--pink:#ff4fd8;--ok:#5fe1a0;--warn:#ffc061;--bad:#ff6b5b;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3)}
#top{position:fixed;left:0;right:0;top:0;display:flex;gap:12px;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 16px) 16px 0;pointer-events:none}
#top>*{pointer-events:auto}
#brand{padding:12px 16px;display:flex;align-items:center;gap:14px;min-width:0}
#brand h1{margin:0;font-size:15px;letter-spacing:.42em;font-weight:700}
#brand .sep{width:1px;height:28px;background:var(--line2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--faint);flex:none;transition:.3s}
.dot.ok{background:var(--ok);box-shadow:0 0 12px var(--ok)}.dot.warn{background:var(--warn);box-shadow:0 0 12px var(--warn)}
#state{min-width:0}#state b{display:block;font-size:14px;font-weight:600;white-space:nowrap}
#state span{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
#kpi{margin-left:auto;display:flex;gap:6px;padding:6px}
#kpi div{padding:6px 12px;min-width:74px}
#kpi span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
#kpi b{font:600 18px var(--mono);color:var(--holo);text-shadow:0 0 10px rgba(95,225,255,.45)}
#kpi b.warn{color:var(--warn);text-shadow:0 0 10px rgba(255,192,97,.5)}
button{font:inherit;color:var(--text);background:rgba(95,225,255,.06);border:1px solid var(--line2);border-radius:14px;padding:12px 16px;cursor:pointer;transition:background .15s,transform .1s}
button:active,button.held{transform:scale(.97);background:rgba(95,225,255,.22)}
button:disabled{opacity:.3;pointer-events:none}
#connect{padding:16px 20px;font-weight:600}
#mode{display:flex;padding:4px;border-radius:999px;gap:2px;align-self:center;flex:none}
#mode button{border:0;background:none;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:600;color:var(--dim)}
#mode button.on{background:rgba(95,225,255,.16);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
#mode button[data-mode=sim].on{background:rgba(178,140,255,.22);color:#efe6ff;box-shadow:inset 0 0 0 1px rgba(178,140,255,.6)}
body.sim #brand{border-color:rgba(178,140,255,.5)}body.sim #kpi b{color:#c9b2ff;text-shadow:0 0 10px rgba(178,140,255,.5)}
#simtag{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%);padding:5px 14px;border-radius:999px;font-size:11px;letter-spacing:.24em;
  text-transform:uppercase;color:#e3d6ff;background:rgba(178,140,255,.16);border:1px solid rgba(178,140,255,.45);display:none;pointer-events:none}
body.sim #simtag{display:block}
body.sim .dot.ok{background:#b28cff;box-shadow:0 0 12px #b28cff}
#connect.big{background:var(--holo);color:#03202a;border-color:var(--holo);box-shadow:0 0 24px rgba(95,225,255,.45)}

#bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;align-items:center;gap:10px;max-width:calc(100vw - 24px)}
#tabs{display:flex;padding:4px;border-radius:999px;gap:2px}
#tabs button{border:0;background:none;border-radius:999px;padding:8px 18px;font-size:13px;font-weight:600;color:var(--dim);letter-spacing:.04em}
#tabs button.on{background:rgba(95,225,255,.16);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
#tabs button[data-tab=pop].on{background:rgba(255,79,216,.18);box-shadow:inset 0 0 0 1px rgba(255,79,216,.5)}
.dock{display:none;gap:8px;padding:8px;max-width:calc(100vw - 24px);overflow-x:auto;align-items:stretch}
.dock.on{display:flex}
.dock button{min-width:96px;padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:15px;flex:none}
.dock button svg{width:26px;height:26px;stroke:var(--holo);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(95,225,255,.5))}
.dock button.on{background:var(--holo);color:#03202a;border-color:var(--holo);box-shadow:0 0 22px rgba(95,225,255,.5)}
.dock button.on svg{stroke:#03202a;filter:none}
.dock button.stop{border-color:rgba(255,107,91,.55);background:rgba(255,107,91,.12);color:#ffd9d3}
.dock button.stop svg{stroke:var(--bad);filter:drop-shadow(0 0 6px rgba(255,107,91,.6))}
.dock button.arm{background:rgba(255,192,97,.2);border-color:var(--warn)}
.dock .gap{width:1px;background:var(--line2);margin:6px 2px;flex:none}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,44px);gap:4px;flex:none}
.pad button{min-width:0;padding:0;font-size:20px;border-radius:12px}
.pad .up{grid-column:2}.pad .l{grid-row:2;grid-column:1}.pad .dn{grid-row:2;grid-column:2}.pad .r{grid-row:2;grid-column:3}
.speed{display:flex;flex-direction:column;gap:4px;flex:none}
.speed button{min-width:74px;padding:8px 10px;font-size:12px;flex:1}
.knee{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 10px;width:170px;flex:none}
.knee label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
.knee label b{color:var(--pink);font:600 12px var(--mono)}
.knee input{width:100%;accent-color:var(--pink)}
.tip{display:flex;align-items:center;padding:0 10px;color:var(--dim);font-size:13px;width:190px;flex:none;line-height:1.35}
.tip b{color:var(--pink)}

#specs{position:fixed;top:calc(env(safe-area-inset-top) + 92px);right:16px;width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 260px);overflow:auto;padding:16px 18px;
  transform:translateX(calc(100% + 40px));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#specs.on{transform:none}
#specs h2{margin:0 0 12px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
#specs h2 button{padding:4px 10px;font-size:12px;border-radius:999px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.sg div{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.sg span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.sg b{font:600 15px var(--mono);color:var(--holo)}
#specs table{width:100%;border-collapse:collapse;font:12px var(--mono)}
#specs th{font:600 10px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line2)}
#specs th:first-child,#specs td:first-child{text-align:left}
#specs td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
#specs tr.leg td{color:var(--dim);font:600 10px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding-top:10px;border:0}
#specs td.hot{color:var(--warn)}#specs td.off{color:var(--bad)}

#back{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom) + 24px);color:var(--dim);font-size:13px;text-decoration:none;padding:10px 14px}
#hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--dim);font-size:13px;letter-spacing:.2em;text-transform:uppercase;pointer-events:none;transition:opacity .6s}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 96px);transform:translate(-50%,-8px);opacity:0;padding:8px 16px;border-radius:999px;font-size:13px;pointer-events:none;transition:.3s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:980px){#back{display:none}}
@media (max-width:820px){#kpi div{min-width:0;padding:6px 8px}#kpi b{font-size:15px}.dock button{min-width:80px}}
@media (max-width:560px){#top{flex-wrap:wrap}#brand{flex:1 1 0;min-width:0;overflow:hidden}#brand h1{letter-spacing:.3em}#connect{flex:none;padding:12px 16px}#kpi{order:3;margin-left:0;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
  #kpi div{padding:4px 6px}#kpi span{font-size:9px;letter-spacing:.1em}#kpi b{font-size:14px}#state span{max-width:40vw}.dock button{min-width:70px;font-size:13px}#specs{top:calc(env(safe-area-inset-top) + 150px)}}
</style>
</head>
<body>
<div id="view"></div>
<div id="hint">hologram laden…</div>
<div id="toast" class="glass"></div>

<div id="top">
  <div id="brand" class="glass"><h1>ARACHNE</h1><i class="sep"></i><i class="dot" id="dot"></i>
    <div id="state"><b id="title">niet verbonden</b><span id="msg">steek de adapter in dit toestel</span></div></div>
  <div id="kpi" class="glass">
    <div><span>servo's</span><b id="k-n">–</b></div><div><span>spanning</span><b id="k-v">–</b></div>
    <div><span>warmst</span><b id="k-t">–</b></div><div><span>torque</span><b id="k-q">–</b></div>
  </div>
  <div id="mode" class="glass"><button data-mode="echt" class="on">Echt</button><button data-mode="sim">Simulatie</button></div>
  <button id="connect" class="glass big">Verbind</button>
</div>
<div id="simtag">simulatie · de echte spin beweegt niet</div>

<aside id="specs" class="glass">
  <h2>Specs <button id="specs-x">sluiten</button></h2>
  <div class="sg" id="sg"></div>
  <table><thead><tr><th>servo</th><th>id</th><th>hoek</th><th>°C</th><th>V</th><th>last</th></tr></thead><tbody id="st"></tbody></table>
</aside>

<div id="bottom">
  <div id="tabs" class="glass"><button data-tab="basis" class="on">Basis</button><button data-tab="extra">Extra</button><button data-tab="pop">Poppenspel</button></div>

  <div class="dock glass on" id="d-basis">
    <button data-act="stand"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>Opstaan</button>
    <button data-act="dance"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg><span>Dansen</span></button>
    <button data-act="lie"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>Liggen</button>
    <button data-act="rest"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Rust</button>
    <button data-act="rescan"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>Zoeken</button>
    <i class="gap"></i>
    <button data-act="stop" class="stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>Stop</button>
  </div>

  <div class="dock glass" id="d-extra">
    <div class="pad">
      <button class="up" data-drive="lopen" title="vooruit">▲</button>
      <button class="l" data-drive="links draaien" title="links draaien">⟲</button><button class="dn" data-drive="achteruit" title="achteruit">▼</button><button class="r" data-drive="rechts draaien" title="rechts draaien">⟳</button>
    </div>
    <div class="speed"><button data-level="normaal" class="on">normaal</button><button data-level="snel">snel</button></div>
    <i class="gap"></i>
    <button data-act="six"><svg viewBox="0 0 24 24"><path d="M3 9h7M14 15h7M6.5 9v4M17.5 15v-4"/><path d="M5 6.5l1.5-1.5 1.5 1.5M16 17.5l1.5 1.5 1.5-1.5"/></svg>6-7</button>
    <button data-act="six67"><svg viewBox="0 0 24 24"><path d="M3 9h7M14 15h7M6.5 9v4M17.5 15v-4"/><path d="M5 6.5l1.5-1.5 1.5 1.5M16 17.5l1.5 1.5 1.5-1.5"/></svg><span>6-7 ∞</span></button>
    <button data-act="clap"><svg viewBox="0 0 24 24"><path d="M8 13l-2.5-6a1.3 1.3 0 0 1 2.4-1L10 10M10 10l-1.6-5a1.3 1.3 0 0 1 2.5-.8L13 10M13 10l.2-3a1.3 1.3 0 0 1 2.6.2L15.5 13"/><path d="M15.5 13c.8 3-1 6.5-4.5 7s-5.5-2-6-5"/><path d="M18 4l1.5-1.5M19.5 7H22M17 1.5V0"/></svg>Klappen</button>
    <button data-act="wave"><svg viewBox="0 0 24 24"><path d="M7 21l3-9 4-3M14 9l3-6M17 3c1.5 1 3 3 3 5"/><path d="M4 9c0-2 1-4 3-5"/></svg>Zwaaien</button>
    <button data-act="jump"><svg viewBox="0 0 24 24"><path d="M12 3v11M7 8l5-5 5 5"/><path d="M4 21c2-3 4-4 8-4s6 1 8 4"/></svg><span>Springen</span></button>
    <button data-act="specs"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Specs</button>
    <i class="gap"></i>
    <button data-act="stop" class="stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>Stop</button>
  </div>

  <div class="dock glass" id="d-pop">
    <div class="tip" id="pop-tip"><span>Tik op een <b>voet</b> en sleep: de echte poot volgt je vinger.</span></div>
    <div class="knee"><label>knie <b id="knee-v">–</b></label><input type="range" id="knee" min="0" max="1000" value="500" disabled></div>
    <button data-act="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></svg>Alles terug</button>
    <i class="gap"></i>
    <button data-act="stop" class="stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>Stop</button>
  </div>
</div>
<a id="back" class="glass" href="index.html">← terug</a>

<script src="web/usb.js"></script>
<script src="web/holo_fk.js"></script>
<script src="web/update.js"></script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const APP = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
if (!APP) $('#back').href = '/';
let toastT = 0;
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 2600); }

// ------------------------------------------------------------------ scene
const view = $('#view');
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); view.appendChild(renderer.domElement);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05090c); scene.fog = new THREE.FogExp2(0x05090c, 1.1);
const cam = new THREE.PerspectiveCamera(36, 1, .01, 20);
const controls = new OrbitControls(cam, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = .6; controls.minDistance = .35; controls.maxDistance = 2.4;
controls.addEventListener('start', () => controls.autoRotate = false);
const world = new THREE.Group(); world.rotation.x = -Math.PI / 2; scene.add(world);   // MuJoCo z-up -> three y-up
scene.add(new THREE.HemisphereLight(0x9fe8ff, 0x1a0b22, .9));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1.2, 2, .8); scene.add(key);
const rim = new THREE.PointLight(0xff4fd8, 3, 2); rim.position.set(-.5, .5, -.6); scene.add(rim);

const SIMC = new THREE.Color(0xb28cff), HOLO = new THREE.Color(0x5fe1ff), HOT = new THREE.Color(0xffc061), OFF = new THREE.Color(0xff6b5b), PINK = new THREE.Color(0xff4fd8);
const uni = {time: {value: 0}};
function holoMat(color = HOLO) {
  return new THREE.ShaderMaterial({
    uniforms: {time: uni.time, color: {value: color.clone()}, power: {value: 1}},
    vertexShader: `varying vec3 vN; varying vec3 vV; varying float vY;
      void main(){ vec4 w = modelMatrix*vec4(position,1.); vY = w.y; vec4 mv = viewMatrix*w;
        vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `uniform float time; uniform vec3 color; uniform float power; varying vec3 vN; varying vec3 vV; varying float vY;
      void main(){ float f = pow(1.-abs(dot(normalize(vN), vV)), 2.4);
        float scan = .55+.45*sin(vY*900.-time*6.);
        float flick = .94+.06*sin(time*37.)*sin(time*11.);
        float a = (.07+f*.95)*(.75+.25*scan)*flick*power;
        vec3 c = color*(.35+f*1.6) + vec3(.6,.95,1.)*pow(f,6.)*.6;
        gl_FragColor = vec4(c*a, a); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide});
}

// projector base: glowing disc, rings, light cone, rising particles
const base = new THREE.Group(); scene.add(base);
(function () {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256; const g = cv.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(95,225,255,.55)'); gr.addColorStop(.35, 'rgba(95,225,255,.16)'); gr.addColorStop(1, 'rgba(95,225,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const add = {transparent: true, depthWrite: false, blending: THREE.AdditiveBlending};
  const disc = new THREE.Mesh(new THREE.CircleGeometry(.42, 64), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(cv), ...add}));
  disc.rotation.x = -Math.PI / 2; base.add(disc);
  for (const [r, o] of [[.18, .5], [.26, .28], [.34, .5], [.40, .18]]) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(r, r + .0025, 128), new THREE.MeshBasicMaterial({color: HOLO, opacity: o, side: THREE.DoubleSide, ...add}));
    ring.rotation.x = -Math.PI / 2; ring.position.y = .001; base.add(ring);
  }
  const ticks = new THREE.Group();
  for (let i = 0; i < 72; i++) {
    const t = new THREE.Mesh(new THREE.PlaneGeometry(.002, i % 6 ? .008 : .02), new THREE.MeshBasicMaterial({color: HOLO, opacity: .6, side: THREE.DoubleSide, ...add}));
    const a = i / 72 * Math.PI * 2; t.position.set(Math.cos(a) * .37, .002, Math.sin(a) * .37); t.rotation.set(-Math.PI / 2, 0, -a + Math.PI / 2); ticks.add(t);
  }
  base.add(ticks); base.userData.ticks = ticks;
  const cone = new THREE.Mesh(new THREE.CylinderGeometry(.30, .40, .5, 64, 1, true), new THREE.ShaderMaterial({
    uniforms: {time: uni.time}, side: THREE.DoubleSide, ...add,
    vertexShader: 'varying vec2 vU; void main(){ vU = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: 'uniform float time; varying vec2 vU; void main(){ float a = pow(1.-vU.y, 3.)*.10*(.8+.2*sin(vU.x*60.+time)); gl_FragColor = vec4(vec3(.37,.88,1.)*a, a); }'}));
  cone.position.y = .25; base.add(cone); base.userData.cone = cone;
  const n = 260, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * .38; pos.set([Math.cos(a) * r, Math.random() * .5, Math.sin(a) * r], i * 3); }
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(pg, new THREE.PointsMaterial({color: HOLO, size: .004, opacity: .55, ...add}));
  base.add(pts); base.userData.pts = pts;
})();

// ------------------------------------------------------------------ the two looks: hologram (real meshes) and neon (puppet mode)
let H = null, plan = null; const bodies = [], legMats = {};
const holo = new THREE.Group(), neon = new THREE.Group(); world.add(holo, neon); neon.visible = false;
const LEGS = ['L1', 'L2', 'L3', 'L4', 'L5', 'L6'];
const legJ = L => [0, 1, 2].map(k => (+L[1] - 1) * 3 + k);          // plan index of yaw, hip, knee

const armor = new THREE.MeshStandardMaterial({color: 0x1a2a33, metalness: .9, roughness: .22, emissive: 0x041821});
const glowBasic = c => new THREE.MeshBasicMaterial({color: c, fog: false, toneMapped: false});
const Y = new THREE.Vector3(0, 1, 0);
function neonLeg(L) {          // tapered armour segments + glowing joints + a foot handle you can grab

    td[3].textContent = robot && robot.temps[i] != null ? robot.temps[i] : '–'; td[3].className = robot && robot.temps[i] > 50 ? 'hot' : '';
    td[4].textContent = robot && robot.volts[i] != null ? robot.volts[i].toFixed(1) : '–';
    td[5].textContent = robot && robot.loads[i] != null ? Math.round(robot.loads[i]) + '%' : '–';
    td[1].className = here ? '' : 'off';
  });
}
setInterval(specsLive, 500);

// ------------------------------------------------------------------ robot over USB
function show(r, msg) {
  const n = r.found.length, ok = n === 18;
  $('#k-n').textContent = r.link ? n + '/18' : '–';
  $('#k-v').textContent = r.volt ? r.volt.toFixed(1) + ' V' : '–'; $('#k-v').classList.toggle('warn', !!r.volt && r.volt < 10.8);
  $('#k-t').textContent = r.temp ? r.temp + '°' : '–'; $('#k-t').classList.toggle('warn', r.temp > 50);
  $('#k-q').textContent = r.torque === null ? '–' : r.torque + '/18';
  $('#title').textContent = r.action ? r.action + '…' : !r.link ? 'niet verbonden' : ok ? 'spin ' + r.pose : n ? 'niet alle servo\'s' : 'geen servo\'s';
  if (msg) $('#msg').textContent = msg;
  $('#dot').className = 'dot ' + (!r.link ? '' : !ok || (r.volt && r.volt < 10.8) ? 'warn' : 'ok');
  const busy = !!r.action, connectedBad = r.link && !ok;
  $$('[data-act]').forEach(b => {
    const a = b.dataset.act;
    b.disabled = a === 'stop' ? !r.link : a === 'rescan' ? !r.link || busy : a === 'specs' || a === 'home' ? false
      : connectedBad || (r.link && busy && !(a === 'dance' && r.action === 'dansen') && !(a === 'six67' && r.action === '6-7 ∞'));
  });
  $$('[data-drive]').forEach(b => b.disabled = connectedBad || (r.link && busy && r.action !== 'lopen'));
  sixBtn();
  const db = $('[data-act=dance]'); db.classList.toggle('on', r.action === 'dansen'); db.querySelector('span').textContent = r.action === 'dansen' ? 'Stop dans' : 'Dansen';
  $('#connect').classList.toggle('big', !r.link); $('#connect').textContent = r.link ? '↻' : 'Verbind'; $('#connect').hidden = simMode;
  if (simMode) $('#title').textContent = r.action ? r.action + '… (sim)' : 'sim: spin ' + r.pose;
  if (tab === 'pop' && r.link && ok && !r.action) r.puppetStart();
  tint(r);
}
async function connect() {
  try {
    if (!plan) await new Promise(r => { const t = setInterval(() => plan && (clearInterval(t), r()), 50); });
    if (simMode) await setMode('echt');
    if (!realRobot) { realRobot = new ArachneUSB.Robot(plan, (r, m) => r === robot && show(r, m)); realRobot.onBeat = clapSound; }
    robot = realRobot;
    $('#msg').textContent = 'verbinden…';
    const how = await robot.connect();
    show(robot, `${robot.found.length}/18 servo's via ${how}`);
  } catch (e) { $('#msg').textContent = e.name === 'NotFoundError' ? 'geen adapter gekozen' : 'fout: ' + e.message; }
}
$('#connect').onclick = connect;
$('#specs-x').onclick = () => $('#specs').classList.remove('on');

(async function idle() {           // between actions: follow the real servos, health every 3 s
  let lastH = 0;
  for (;;) {
    if (robot && robot.link && !robot.action && robot.found.length) {
      try {
        await robot.readPos();
        if (performance.now() - lastH > 3000) { lastH = performance.now(); await robot.health(); show(robot); }
      } catch (e) { }
    }
    await new Promise(r => setTimeout(r, 60));
  }
})();
if (!ArachneUSB.pickLink()) $('#msg').textContent = 'deze browser kan geen USB: gebruik de ARACHNE-app of Chrome';
else if (APP) connect();   // app: no click needed
</script>
